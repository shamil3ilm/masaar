# Continuous integration for the Masaar compliance platform.
#
# tests/Feature/Security carries the load here: it sweeps the router for
# unguarded routes and proves tenant scoping holds, so a refactor that opens a
# cross-tenant path fails the build rather than reaching a deployment.
#
# PHP 8.4 is required by the dependency tree (symfony/* and pest/*), not a
# preference. Keep this in step with the "php" constraint in composer.json.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # The sandbox round trip, nightly. Nothing else here needs a clock.
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # sqlite3/pdo_sqlite back the in-memory test database declared in
          # phpunit.xml; bcmath is required for monetary arithmetic.
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # .env.example ships APP_ENV=production, so both generators would stop for
      # an "are you sure?" confirmation and hang the runner. --force skips it.
      # phpunit.xml overrides APP_ENV to "testing" for the run itself.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force

      - name: Run test suite
        run: php artisan test

  # The suite above runs on in-memory SQLite, which is fast but permissive: it
  # does not enforce foreign key types, it accepts a WHERE on a column that does
  # not exist, and it is a console process, where the tenant scope stands down.
  # Each has hidden real defects — submissions declared bigint against UUID keys
  # that MySQL refused outright, an ICV allocation that handed every invoice the
  # same counter, and four separate reads of columns no table has. This job runs
  # the same application against MySQL, over real HTTP and through the suite.
  e2e:
    name: MySQL (suite and end-to-end)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: masaar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # This job serves HTTP rather than running PHPUnit, so nothing overrides
      # the environment the way phpunit.xml does — .env is what runs. Its
      # database defaults already name the service above, and session, cache and
      # queue are all database-backed, so no other service is needed.
      #
      # Only APP_ENV is changed: .env.example ships production, and the checks
      # below are written against a normal application environment.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run end-to-end checks
        run: php tests/E2e/run.php

      # The same suite the first job runs, against the engine production uses.
      #
      # SQLite accepts a WHERE on a column that does not exist: it matches
      # nothing and returns, so the query looks merely unproductive. MySQL
      # raises SQLSTATE[42S22]. That difference hid four defects at once — a
      # certificate read from a column no table has, a clearance timestamp
      # written to another, a submission filtered on 'status' where the column
      # is 'state', and an expiry read from a third. Each was invisible while
      # the suite was green.
      #
      # The environment is passed inline rather than by editing phpunit.xml, so
      # the default local run stays on SQLite and stays fast.
      - name: Run test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: masaar
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  # Some Pint fixer combinations need more than one pass to converge. If
  # `pint --test` still reports files straight after running `pint`, run it
  # again — the second pass settles it.
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  # The conformance suite runs ZATCA's own validator — the XSD, the EN 16931
  # rules and the KSA Schematron — over documents this platform generated. It is
  # the only check here whose verdict comes from the authority rather than from
  # our reading of the specification.
  #
  # It needs the SDK, which is a licensed download that cannot be committed, so
  # the tests skip when it is absent. That is honest and it is also silent: 25
  # tests reported "OK" on every push while checking nothing. This job makes the
  # absence visible, and turns the checks on the moment the SDK is available.
  #
  # To enable: set the ZATCA_SDK_URL secret to somewhere the runner can fetch
  # the unpacked SDK as a .zip or .tar.gz (a private release asset works), and
  # ZATCA_SDK_TOKEN if that location needs a bearer token.
  conformance:
    name: ZATCA conformance
    runs-on: ubuntu-latest

    env:
      SDK_URL: ${{ secrets.ZATCA_SDK_URL }}
      SDK_TOKEN: ${{ secrets.ZATCA_SDK_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Report that conformance is unverified
        if: env.SDK_URL == ''
        run: |
          echo "::warning title=ZATCA conformance not verified::ZATCA_SDK_URL is not set, so the SDK conformance suite did not run. The documents this build produces have not been checked against the authority's own validator."

      - name: Set up PHP ${{ env.PHP_VERSION }}
        if: env.SDK_URL != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      # The SDK is a Java application; without a runtime the suite skips for a
      # second reason and the job would look configured when it is not.
      # Temurin is preinstalled on GitHub's Ubuntu images, so the runner's own
      # JDK is used rather than an action.
      #
      # Not a preference: this job only runs once ZATCA_SDK_URL is set, so a
      # wrong action version here surfaces at the moment conformance is first
      # enabled and looks like a problem with the SDK. The sibling image-scan
      # job failed exactly that way on a pinned scanner action that did not
      # exist. Fewer versions to be wrong about on a path that runs rarely.
      - name: Use the runner's JDK
        if: env.SDK_URL != ''
        run: |
          # 17 by preference, because that is what the SDK is tested against
          # here; whatever is default otherwise, and the version is printed so
          # a failure downstream can be read against it.
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
            "$JAVA_HOME_17_X64/bin/java" -version
          elif command -v java >/dev/null 2>&1; then
            java -version
          else
            echo "::error title=No Java on the runner::The ZATCA SDK is a Java application and no JDK was found."
            exit 1
          fi

      - name: Install dependencies
        if: env.SDK_URL != ''
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        if: env.SDK_URL != ''
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force

      - name: Fetch the ZATCA SDK
        if: env.SDK_URL != ''
        run: |
          mkdir -p "$RUNNER_TEMP/zatca"

          auth=()
          if [ -n "$SDK_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $SDK_TOKEN")
          fi

          url="$SDK_URL"

          # Resolve a release endpoint to the asset hanging off it.
          #
          # The secret is far easier to set correctly as a release URL than as
          # an asset URL: a private repository's asset id appears nowhere in
          # the GitHub web UI, so pointing at the asset directly means reaching
          # for the API with a token just to configure the thing. A URL ending
          # /releases/latest can be read off the address bar, and it keeps
          # working when the SDK is replaced by a newer release.
          #
          # An asset URL still works and is matched first, because it carries
          # no .assets of its own and must not be probed as though it did.
          case "$url" in
            https://api.github.com/repos/*/releases/assets/*) ;;
            https://api.github.com/repos/*/releases/*)
              release=$(curl -fsSL "${auth[@]}" -H "Accept: application/vnd.github+json" "$url")
              url=$(printf '%s' "$release" | jq -r '([.assets[]? | select((.name // "") | test("zatca"; "i")) | .url] + [.assets[]? | .url])[0] // empty')

              if [ -z "$url" ]; then
                echo "::error title=No SDK asset::The release at ZATCA_SDK_URL carries no asset. Attach the SDK archive to the release, or point the secret at the asset itself."
                exit 1
              fi

              echo "Resolved the release to asset $url"
              ;;
          esac

          # Accept: application/octet-stream matters for a GitHub release
          # asset: without it the API answers with the asset's JSON metadata
          # and the download "succeeds" as a few hundred bytes that no
          # unpacker can read. Harmless anywhere else.
          curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/sdk.archive" "$url"

          # Read the type off the bytes rather than the URL. A release asset
          # URL ends in an id, not a file name, so switching on the extension
          # picks the wrong unpacker for the most likely way of hosting it.
          case "$(file -b --mime-type "$RUNNER_TEMP/sdk.archive")" in
            application/zip)  unzip -q "$RUNNER_TEMP/sdk.archive" -d "$RUNNER_TEMP/zatca" ;;
            application/gzip) tar -xzf "$RUNNER_TEMP/sdk.archive" -C "$RUNNER_TEMP/zatca" ;;
            *)
              echo "::error title=SDK archive unreadable::ZATCA_SDK_URL returned $(file -b "$RUNNER_TEMP/sdk.archive"). Expected a zip or a gzipped tar. Set it to https://api.github.com/repos/OWNER/REPO/releases/latest and give ZATCA_SDK_TOKEN read access to that repository - a releases/download/ link needs a browser session and answers HTML to a token."
              exit 1
              ;;
          esac
          # The archive may wrap the SDK in one or more directories. Find the
          # root by the jar, which is what the tests actually look for.
          jar=$(find "$RUNNER_TEMP/zatca" -name 'zatca-einvoicing-sdk-*.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error title=SDK not found::No zatca-einvoicing-sdk jar in the archive at ZATCA_SDK_URL."
            exit 1
          fi
          root=$(dirname "$(dirname "$jar")")

          # Repoint the SDK at where it actually landed.
          #
          # install.sh writes absolute paths into Configuration/config.json
          # from the machine it is run on, so an archive made from an
          # installed copy carries that machine's paths - C:/Users/... from a
          # Windows checkout. SdkValidator points SDK_CONFIG at this file but
          # cannot fix what is inside it, and the SDK does not report an
          # unreadable schema as a configuration problem: it reports every
          # document as invalid. Regenerated here from defaults.json, the
          # relative template the SDK ships for exactly this, so the archive
          # can be pristine or installed and either works.
          defaults="$root/Configuration/defaults.json"
          if [ ! -f "$defaults" ]; then
            echo "::error title=SDK incomplete::No Configuration/defaults.json beside the jar at $root."
            exit 1
          fi

          jq --arg root "$root" 'map_values($root + "/" + ltrimstr("../"))' "$defaults" > "$root/Configuration/config.json"

          # Every rewritten path is checked, and its case repaired, because a
          # path that does not exist surfaces as every document failing
          # validation rather than as a configuration problem.
          #
          # This is not hypothetical and not ours: the SDK's own defaults.json
          # names Data/Rules/schematrons while the archive ships
          # Data/Rules/Schematrons. On any Windows or macOS checkout the
          # difference is invisible, so the SDK is shipped that way; on this
          # Ubuntu runner the two Schematron files are simply not found, and
          # the EN 16931 and ZATCA rule checks would report every document
          # invalid with nothing pointing at the cause.
          #
          # Checking only xsdPath - which does exist - cleared this silently.
          missing=()

          for key in $(jq -r 'keys[]' "$root/Configuration/config.json"); do
            path=$(jq -r --arg k "$key" '.[$k]' "$root/Configuration/config.json")

            if [ -e "$path" ]; then
              continue
            fi

            # -ipath matches the whole path ignoring case, which is exactly
            # the class of difference being repaired.
            actual=$(find "$root" -ipath "$path" -print -quit 2>/dev/null)

            if [ -n "$actual" ]; then
              jq --arg k "$key" --arg v "$actual" '.[$k] = $v'                 "$root/Configuration/config.json" > "$root/Configuration/config.next"
              mv "$root/Configuration/config.next" "$root/Configuration/config.json"
              echo "Repaired the case of $key: $actual"
            else
              missing+=("$key=$path")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=SDK paths wrong::config.json names paths that do not exist in the archive: ${missing[*]}"
            cat "$root/Configuration/config.json"
            exit 1
          fi

          echo "ZATCA_SDK_PATH=$root" >> "$GITHUB_ENV"

      # --do-not-cache-result keeps a skip from being reported as a pass on a
      # rerun. The grep is the point of the job: a skipped conformance test is
      # the failure this whole job exists to stop being invisible.
      - name: Run the conformance suite
        if: env.SDK_URL != ''
        run: |
          php artisan test --filter ZatcaConformance | tee conformance.log
          # The summary line, not the body: two test names elsewhere in this
          # suite end in "is skipped" and would match anything looser.
          if grep -qE '^[[:space:]]*Tests:.*skipped' conformance.log; then
            echo "::error title=Conformance skipped::The SDK was configured but the suite still skipped. Check the jar path and the Java runtime."
            exit 1
          fi

  # Onboarding, end to end, against ZATCA's developer sandbox.
  #
  # Nine defects sat between generating a CSR and holding a certificate, and
  # not one was reachable from a test that did not talk to the authority: the
  # SDK validates a document you hand it, while ZATCA recomputes the hash and
  # verifies the QR itself. Every one of them could return with this suite
  # green, so the round trip runs here.
  #
  # No credentials. The developer portal accepts a fixed OTP, and the CSR is
  # built in-process now rather than by the licensed SDK, so there is nothing
  # to configure and nothing to keep secret.
  #
  # On a schedule and on request rather than on every push: it depends on a
  # service outside this repository, and a failure means either a regression
  # here or ZATCA being down. Blocking merges on the second would be wrong.
  sandbox:
    name: ZATCA sandbox round trip
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force

      # --target on both commands, and the same one: the template inside the
      # request is what tells ZATCA which environment it is for, so a request
      # built for one and sent to another is refused before anything this job
      # exists to check is reached.
      - name: Generate a certificate request
        run: php artisan fatoora:generate-csr --standard --simplified --target=sandbox

      # --step=full is CCSID, the six compliance documents, then PCSID. The
      # command exits non-zero if any document is refused, and the grep is
      # belt and braces: a future change that reports failure on stdout while
      # exiting 0 is exactly the shape of bug this job exists to catch.
      - name: Onboard against the sandbox
        run: |
          php artisan fatoora:onboard --step=full --otp=123345 --target=sandbox | tee onboard.log
          if grep -q 'FAILED' onboard.log; then
            echo "::error title=Sandbox round trip failed::A document did not pass. A GATEWAY line is ZATCA's gateway timing out, not a refusal - re-run. See the table above."
            exit 1
          fi
          grep -q 'All 6 invoices passed' onboard.log || {
            echo "::error title=Sandbox round trip incomplete::The compliance check did not report six passes."
            exit 1
          }

      # Onboarding ends at a production CSID, and until now so did this job -
      # so whether the authority accepts a signed invoice, and whether a
      # stamped copy comes back, had never been observed. It needs no
      # taxpayer: the developer portal issues the PCSID this step uses and
      # serves clearance and reporting as well.
      #
      # Standard documents are cleared, simplified are reported, which is
      # what makes this different from the compliance check above - a
      # different endpoint with different rules, and the one real invoices go
      # to.
      - name: Clear and report with the production certificate
        run: |
          php artisan fatoora:onboard --step=submit --target=sandbox | tee submit.log

          if grep -q 'REFUSED' submit.log; then
            echo "::error title=A document was refused::The authority rejected a document submitted with the production certificate. The outcome column says why; a GATEWAY line is a timeout rather than a refusal."
            exit 1
          fi

          grep -q 'All 6 documents were accepted' submit.log || {
            echo "::error title=Submission incomplete::The step did not report six acceptances."
            exit 1
          }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # Reports known CVEs in the locked dependency tree on every push, so an
      # advisory published against a pinned package surfaces here.
      - name: Audit dependencies
        run: composer audit --locked

  # The container, not the dependency tree.
  #
  # composer audit above covers the PHP packages. It says nothing about the
  # base image: the OS packages, the PHP build and everything else apt put
  # there, which is where a platform handling tax data is most likely to be
  # carrying a known remote hole it never chose.
  #
  # Gated, not advisory, but narrowly: CRITICAL only, and only where a fixed
  # version exists. A gate that fires on every unfixable HIGH in a base image
  # teaches people to ignore it, which is worse than not having it.
  image:
    name: Container image scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t masaar:ci .

      # The scanner is run directly rather than through aquasecurity's action.
      #
      # The action is versioned independently of Trivy itself and a tag that
      # does not exist fails the job before anything is scanned - which is how
      # this job first failed, on a pinned 0.28.0 that is not a release. The
      # container image has no such ambiguity, and a scanner is one of the few
      # things that should track latest anyway: a pinned scanner finds the
      # vulnerabilities that were known when it was pinned.
      #
      # The image is handed over as a tar rather than by name so the scanner
      # needs no access to the Docker socket.
      - name: Scan the image
        run: |
          docker save masaar:ci -o image.tar
          # Pulled explicitly, from either official path.
          #
          # The scanner is published to GitHub Container Registry under the
          # project name and to Docker Hub under the company name, which are
          # not the same word: ghcr.io/aquasecurity/trivy and aquasec/trivy.
          # aquasecurity/trivy on Docker Hub does not exist, and asking for
          # it fails as a denied pull rather than as a missing image, which
          # reads like an authentication problem and is not one.
          #
          # GHCR first: it is not subject to the anonymous pull limits that
          # Docker Hub applies per source address, which CI runners share.
          scanner=""
          for candidate in ghcr.io/aquasecurity/trivy:latest aquasec/trivy:latest; do
            if docker pull -q "$candidate" >/dev/null 2>&1; then
              scanner="$candidate"
              echo "Scanner: $scanner"
              break
            fi
            echo "Could not pull $candidate"
          done

          if [ -z "$scanner" ]; then
            echo "::error title=Scanner unavailable::Neither ghcr.io/aquasecurity/trivy nor aquasec/trivy could be pulled."
            exit 1
          fi

          docker run --rm -v "$PWD:/work" -w /work "$scanner" image --input image.tar --scanners vuln --format json --output trivy.json --severity CRITICAL,HIGH,MEDIUM --exit-code 0 --no-progress

      # The gate is written here rather than passed to the scanner so the
      # criterion is readable: a CRITICAL that something can be done about.
      # Firing on an unfixable one would make the job noise, and a gate people
      # route around is worse than none.
      - name: Fail on a fixable critical
        run: |
          jq -r '[.Results[]?.Vulnerabilities[]?
                  | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")]' trivy.json > critical.json

          count=$(jq 'length' critical.json)
          echo "Fixable CRITICAL findings: $count"

          if [ "$count" -gt 0 ]; then
            jq -r '.[] | "  " + .VulnerabilityID + "  " + .PkgName + " " + (.InstalledVersion // "?") + " -> " + .FixedVersion' critical.json
            echo "::error title=Fixable critical vulnerabilities in the image::$count package(s) have a fixed version available. Rebuild on an updated base image."
            exit 1
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 30

  # A dynamic scan of the running API.
  #
  # On a schedule and on request, and it does not gate. That is deliberate and
  # it is not timidity: a scanner whose first report nobody has read can only
  # be set to block everything or to block nothing, and the second dressed up
  # as a gate is the worse of the two. Read the first report, decide which
  # rules matter here, commit them to .zap/rules.tsv as FAIL or IGNORE, and
  # then drop -I below to make it a gate that means something.
  #
  # What it is worth meanwhile: response headers, debug surfaces left exposed,
  # cookie attributes, directory listings - the things a configuration mistake
  # produces rather than a logic error, which the test suite is poor at seeing.
  # It is an API with no browser UI, so expect findings about headers rather
  # than about forms.
  zap:
    name: Dynamic scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: masaar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: masaar_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TELESCOPE_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force
          php artisan migrate --force

      # Served rather than containerised, so the scan reaches the application
      # as the application rather than through a reverse proxy's own headers.
      # Served and scanned in one step, deliberately.
      #
      # php artisan serve was backgrounded in a step of its own, and the
      # shell that owns a background process exits when its step does. The
      # server was gone by the time the scanner looked, so the scan had
      # nothing to scan - and reported success, because the failure was
      # swallowed by a `|| true` meant for findings. One step keeps the
      # server alive as long as the thing that needs it.
      - name: Scan the running application
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          server=$!

          up=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              up=1
              break
            fi
            sleep 2
          done

          if [ "$up" -ne 1 ]; then
            echo "::error title=Application did not start::Nothing answered /api/health in 60s."
            cat serve.log
            exit 1
          fi

          # Published to GHCR under the project name and to Docker Hub under
          # another; the old owasp/zap2docker-* names are retired. Both are
          # tried so a renamed image is not discovered months later, this job
          # being on a schedule.
          scanner=""
          for candidate in ghcr.io/zaproxy/zaproxy:stable zaproxy/zap-stable:latest; do
            if docker pull -q "$candidate" >/dev/null 2>&1; then
              scanner="$candidate"
              echo "Scanner: $scanner"
              break
            fi
            echo "Could not pull $candidate"
          done

          if [ -z "$scanner" ]; then
            echo "::error title=Scanner unavailable::Neither ghcr.io/zaproxy/zaproxy nor zaproxy/zap-stable could be pulled."
            exit 1
          fi

          # A directory of its own, world-writable.
          #
          # The scanner runs as its own unprivileged user inside the
          # container, and the runner's workspace belongs to a different one,
          # so mounting $PWD gave it nowhere to write: it could not place its
          # own configuration ("Permission denied: /zap/wrk/zap.yaml") and
          # then could not write the report, while still completing the scan
          # and exiting 0. Which is how a scan that found thirteen things
          # reported nothing at all.
          mkdir -p zap-out
          chmod 777 zap-out

          # --network host because the scanner is in a container and the
          # application is on the runner. Without it the target is
          # unreachable and the scan examines nothing.
          status=0
          docker run --network host -v "$PWD/zap-out:/zap/wrk/:rw" "$scanner" zap-baseline.py -t http://127.0.0.1:8000 -r zap-report.html -I || status=$?

          kill "$server" 2>/dev/null || true
          echo "Scanner exit status: $status"

          # Findings do not fail this job - that is what -I is for, and why
          # it runs on a schedule rather than as a gate. A scan that produced
          # no report did not run, which is a different thing and has to be
          # visible: that was the previous failure, reported as a pass with
          # the truth in an artifact-upload warning nobody reads.
          if [ ! -s zap-out/zap-report.html ]; then
            echo "::error title=No report::ZAP wrote no report (exit $status). Either the scan did not run, or it could not write - check for a permission error above. A pass here would mean nothing."
            exit 1
          fi

          echo "Baseline report: $(wc -c < zap-out/zap-report.html) bytes"

          # The baseline spider found four URLs: /, /login, /robots.txt and
          # /sitemap.xml. That is the whole of what it can reach by following
          # links, because every endpoint of substance needs a token and
          # nothing links to it - so a scan of this application was a scan of
          # its login page.
          #
          # The documented surface is 97 paths and 119 operations, and ZAP
          # reads an OpenAPI definition directly. Unauthenticated: it exercises
          # every operation and checks what comes back, which also confirms
          # they refuse without a credential. Scanning behind the token would
          # need a context and a credential in CI and is a separate decision.
          cp docs/openapi.yaml zap-out/openapi.yaml

          api_status=0
          docker run --network host -v "$PWD/zap-out:/zap/wrk/:rw" "$scanner" zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -O http://127.0.0.1:8000 -r zap-api-report.html -I || api_status=$?

          echo "API scanner exit status: $api_status"

          # The spec is OpenAPI 3.1. If the add-on cannot read it, nothing is
          # scanned and that must not read as a pass - the same rule as above.
          if [ ! -s zap-out/zap-api-report.html ]; then
            echo "::error title=No API report::The API scan wrote no report (exit $api_status). Check whether the OpenAPI 3.1 definition was parsed."
            exit 1
          fi

          echo "API report: $(wc -c < zap-out/zap-api-report.html) bytes"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-out/zap-report.html
            zap-out/zap-api-report.html
          retention-days: 30
