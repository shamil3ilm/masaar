# Docker Compose configuration
# ZATCA E-Invoicing Compliance Platform
#
# To deploy:
# 1. Copy this file to your server
# 2. Create .env file with required variables
# 3. Run: docker-compose up -d
#
# For production, use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d


services:
  # ==========================================================================
  # Application
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-platform}:${IMAGE_TAG:-latest}
    # No container_name and no published port here: docker-compose.prod.yml
    # runs two replicas, and Compose will not start two containers under one
    # name or bind one host port twice. The development port is in
    # docker-compose.override.yml, which Compose loads only when no -f is
    # given - so production, started with -f, never publishes the app.
    restart: unless-stopped
    # The deployment's .env, whole. The environment block below was the only
    # route in, and as an allow-list it dropped everything it did not name -
    # some 110 settings .env.example documents, among them JWT_SECRET (no
    # token could be signed), API_KEY_PEPPER, MAIL_*, the licence and metrics
    # settings and every ZATCA tuning knob - each silently at its default.
    # The block below still applies on top: it holds compose's own defaults
    # (the db and redis hosts, the database drivers) and takes precedence.
    # Needs Docker Compose 2.24 for required: false.
    env_file:
      - path: .env
        required: false
    environment:
      # The database's root password is in .env for the db service; the
      # application connects as its own user and has no use for it.
      DB_ROOT_PASSWORD: ""

      # Application
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}

      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-platform}
      DB_USERNAME: ${DB_USERNAME:-platform}
      DB_PASSWORD: ${DB_PASSWORD}
      # A separate account for the migrate step alone, when the application
      # account is not to hold TRIGGER, ALTER or DROP. Empty: the
      # application account migrates (docs/operations/DEPLOYMENT.md).
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}

      # Redis, when the redis profile runs it. The same variable the server
      # below is started with, so the two cannot disagree; the server refuses
      # to start without it. Unused while the drivers are on the database.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Reverse proxies whose X-Forwarded-* headers are believed. Empty trusts
      # none; docker-compose.prod.yml sets it for Traefik.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Cache, sessions and queues. The database by default: no extra service,
      # and locks (onOneServer, overlap guards) work across replicas through
      # the cache_locks table. Set all three to redis with the redis profile.
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      # ZATCA Configuration
      ZATCA_ENVIRONMENT: ${ZATCA_ENVIRONMENT:-sandbox}
      # Defaults only: the admin console's Countries page overrides both.
      ZATCA_ENABLED: ${ZATCA_ENABLED:-true}

      # Peppol e-invoicing (UAE). Off unless the host .env, or the admin
      # console, turns it on.
      PEPPOL_AE_ENABLED: ${PEPPOL_AE_ENABLED:-false}
      PEPPOL_ASP_BASE_URL: ${PEPPOL_ASP_BASE_URL:-}
      PEPPOL_ASP_CLIENT_ID: ${PEPPOL_ASP_CLIENT_ID:-}
      PEPPOL_ASP_CLIENT_SECRET: ${PEPPOL_ASP_CLIENT_SECRET:-}
      PEPPOL_ASP_WEBHOOK_SECRET: ${PEPPOL_ASP_WEBHOOK_SECRET:-}

      # Signing credentials.
      #
      # This block is an allow-list: a variable set in the host .env and not
      # named here never reaches the container, and the application reads its
      # default instead. Nothing fails - the credential key falls back to
      # APP_KEY and the rate limits to their config defaults - so a setting
      # that was made deliberately is quietly not in force. Anything added to
      # config/ that a deployment is meant to set has to be added here too.
      ZATCA_CREDENTIAL_DISK: ${ZATCA_CREDENTIAL_DISK:-local}
      ZATCA_CREDENTIAL_KEY: ${ZATCA_CREDENTIAL_KEY}
      ZATCA_CREDENTIAL_PREVIOUS_KEYS: ${ZATCA_CREDENTIAL_PREVIOUS_KEYS}

      # Seals the audit log (config/audit.php). Production refuses to serve
      # without it, and refuses APP_KEY as its value.
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY}
      AUDIT_CHAIN_PREVIOUS_KEYS: ${AUDIT_CHAIN_PREVIOUS_KEYS}

      # Backups (config/backup.php), nightly to the object store the
      # BACKUP_STORAGE_* variables name - any provider speaking the S3
      # protocol. No password, no backup: the run is refused and pages rather
      # than uploading an unencrypted archive. skip-ssl because the image's
      # dump client is MariaDB's and will not accept the compose MySQL's
      # self-signed certificate; see config/database.php.
      BACKUP_DISKS: ${BACKUP_DISKS:-backups}
      BACKUP_ARCHIVE_PASSWORD: ${BACKUP_ARCHIVE_PASSWORD}
      BACKUP_ALERT_AT_MEGABYTES: ${BACKUP_ALERT_AT_MEGABYTES:-16384}
      DB_DUMP_SSL_FLAG: ${DB_DUMP_SSL_FLAG:-skip-ssl}
      BACKUP_STORAGE_ENDPOINT: ${BACKUP_STORAGE_ENDPOINT}
      BACKUP_STORAGE_REGION: ${BACKUP_STORAGE_REGION}
      BACKUP_STORAGE_BUCKET: ${BACKUP_STORAGE_BUCKET}
      BACKUP_STORAGE_KEY: ${BACKUP_STORAGE_KEY}
      BACKUP_STORAGE_SECRET: ${BACKUP_STORAGE_SECRET}
      BACKUP_STORAGE_PATH_STYLE: ${BACKUP_STORAGE_PATH_STYLE:-true}

      # Rate limits. RATE_LIMIT_SUBMISSION and ZATCA_RATE_LIMIT_PER_MINUTE
      # throttle the same traffic and the application refuses to boot in
      # production while they disagree, so both are passed or neither is.
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-600}
      RATE_LIMIT_SUBMISSION: ${RATE_LIMIT_SUBMISSION:-300}
      RATE_LIMIT_ONBOARDING: ${RATE_LIMIT_ONBOARDING:-5}
      RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-20}
      ZATCA_RATE_LIMIT_PER_MINUTE: ${ZATCA_RATE_LIMIT_PER_MINUTE:-300}
      ZATCA_RATE_LIMIT_PER_DAY: ${ZATCA_RATE_LIMIT_PER_DAY:-100000}
      ZATCA_DEVICE_RATE_LIMIT_PER_MINUTE: ${ZATCA_DEVICE_RATE_LIMIT_PER_MINUTE:-120}
      ZATCA_DEVICE_RATE_LIMIT_PER_DAY: ${ZATCA_DEVICE_RATE_LIMIT_PER_DAY:-10000}

      # Auto-migration (set to true for initial deployment)
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}

      # Logging. LOG_STACK names the channels the stack writes to, so an
      # alerting channel added there without being passed here goes nowhere.
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SLACK_WEBHOOK_URL: ${LOG_SLACK_WEBHOOK_URL}
    volumes:
      # Persistent storage for logs and uploads
      - platform-storage:/var/www/html/storage
      - platform-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      # Waited for when the redis profile runs it, ignored when it does not.
      redis:
        condition: service_healthy
        required: false
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # MySQL Database
  # ==========================================================================
  db:
    image: mysql:8.0
    container_name: platform-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-platform}
      MYSQL_USER: ${DB_USERNAME:-platform}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - platform-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # Binary logging is on by default in MySQL 8, and then only SUPER may
      # create a trigger unless this is set. The immutability triggers
      # (migrations 1814 and 1817) are deterministic, which is what the
      # setting asks of them. MYSQL_USER is granted ALL on its database,
      # TRIGGER included.
      - --log-bin-trust-function-creators=1
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Redis (Cache, Sessions, Queues)
  # ==========================================================================
  #
  # Optional. Cache, sessions and queues run on the database by default, so
  # the stack needs no Redis. To use it: COMPOSE_PROFILES=redis, a
  # REDIS_PASSWORD, and CACHE_STORE / SESSION_DRIVER / QUEUE_CONNECTION=redis.
  #
  # The password is required inside the container rather than by ${VAR:?}:
  # compose checks required variables across the whole file, profile or not,
  # so the stack would demand a password for a service it is not running.
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - test -n "$$REDIS_PASSWORD" || { echo 'Set REDIS_PASSWORD in .env' >&2; exit 1; }; exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - platform-redis:/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==========================================================================
# Networks
# ==========================================================================
networks:
  platform-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==========================================================================
# Volumes (Persistent Data)
# ==========================================================================
volumes:
  platform-storage:
    driver: local
  platform-logs:
    driver: local
  platform-mysql:
    driver: local
  platform-redis:
    driver: local
