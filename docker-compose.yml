# Masaar Docker Compose Configuration
# ZATCA E-Invoicing Compliance Platform
#
# For Northwind Infrastructure Deployment:
# 1. Copy this file to your server
# 2. Create .env file with required variables
# 3. Run: docker-compose up -d
#
# For production, use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ==========================================================================
  # Masaar Application
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: masaar/zatca-api:${IMAGE_TAG:-latest}
    # No container_name and no published port here: docker-compose.prod.yml
    # runs two replicas, and Compose will not start two containers under one
    # name or bind one host port twice. The development port is in
    # docker-compose.override.yml, which Compose loads only when no -f is
    # given - so production, started with -f, never publishes the app.
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: Masaar
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}

      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-masaar}
      DB_USERNAME: ${DB_USERNAME:-masaar}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis (for queues and cache)
      REDIS_HOST: ${REDIS_HOST:-redis}
      # Required, and the same value the server below is started with. The
      # two defaults disagreed - null here, masaar_redis there - so a stack
      # started without one ran Redis under a published password the app
      # could not use.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

      # Reverse proxies whose X-Forwarded-* headers are believed. Empty trusts
      # none; docker-compose.prod.yml sets it for Traefik.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Cache & Session
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}

      # ZATCA Configuration
      ZATCA_ENVIRONMENT: ${ZATCA_ENVIRONMENT:-sandbox}

      # UAE FTA Configuration
      #
      # Forwarded for the same reason as ZATCA_ENVIRONMENT. Left out, the
      # container read the config default of sandbox whatever .env said, and
      # under APP_ENV=production the boot guard refused it - so config:cache
      # failed in the entrypoint and the container restart-looped.
      UAE_FTA_ENVIRONMENT: ${UAE_FTA_ENVIRONMENT:-sandbox}
      UAE_FTA_API_KEY: ${UAE_FTA_API_KEY}

      # Signing credentials.
      #
      # This block is an allow-list: a variable set in the host .env and not
      # named here never reaches the container, and the application reads its
      # default instead. Nothing fails - the credential key falls back to
      # APP_KEY and the rate limits to their config defaults - so a setting
      # that was made deliberately is quietly not in force. Anything added to
      # config/ that a deployment is meant to set has to be added here too.
      ZATCA_CREDENTIAL_DISK: ${ZATCA_CREDENTIAL_DISK:-local}
      ZATCA_CREDENTIAL_KEY: ${ZATCA_CREDENTIAL_KEY}
      ZATCA_CREDENTIAL_PREVIOUS_KEYS: ${ZATCA_CREDENTIAL_PREVIOUS_KEYS}

      # Backups (config/backup.php), nightly to the S3-compatible bucket the
      # AWS_* variables name. No password, no backup: the run is refused and
      # pages rather than uploading an unencrypted archive. skip-ssl because
      # the image's dump client is MariaDB's and will not accept the compose
      # MySQL's self-signed certificate; see config/database.php.
      BACKUP_DISKS: ${BACKUP_DISKS:-s3}
      BACKUP_ARCHIVE_PASSWORD: ${BACKUP_ARCHIVE_PASSWORD}
      DB_DUMP_SSL_FLAG: ${DB_DUMP_SSL_FLAG:-skip-ssl}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}

      # Rate limits. RATE_LIMIT_SUBMISSION and ZATCA_RATE_LIMIT_PER_MINUTE
      # throttle the same traffic and the application refuses to boot in
      # production while they disagree, so both are passed or neither is.
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ:-600}
      RATE_LIMIT_SUBMISSION: ${RATE_LIMIT_SUBMISSION:-120}
      RATE_LIMIT_ONBOARDING: ${RATE_LIMIT_ONBOARDING:-5}
      RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-20}
      ZATCA_RATE_LIMIT_PER_MINUTE: ${ZATCA_RATE_LIMIT_PER_MINUTE:-120}
      ZATCA_RATE_LIMIT_PER_DAY: ${ZATCA_RATE_LIMIT_PER_DAY:-10000}

      # Auto-migration (set to true for initial deployment)
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}

      # Logging. LOG_STACK names the channels the stack writes to, so an
      # alerting channel added there without being passed here goes nowhere.
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SLACK_WEBHOOK_URL: ${LOG_SLACK_WEBHOOK_URL}
    volumes:
      # Persistent storage for logs and uploads
      - masaar-storage:/var/www/html/storage
      - masaar-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - masaar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # MySQL Database
  # ==========================================================================
  db:
    image: mysql:8.0
    container_name: masaar-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-masaar}
      MYSQL_USER: ${DB_USERNAME:-masaar}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - masaar-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    networks:
      - masaar-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Redis (Cache, Sessions, Queues)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: masaar-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - masaar-redis:/data
    networks:
      - masaar-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==========================================================================
# Networks
# ==========================================================================
networks:
  masaar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==========================================================================
# Volumes (Persistent Data)
# ==========================================================================
volumes:
  masaar-storage:
    driver: local
  masaar-logs:
    driver: local
  masaar-mysql:
    driver: local
  masaar-redis:
    driver: local
