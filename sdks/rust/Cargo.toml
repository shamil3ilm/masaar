[package]
name = "masaar"
version = "1.0.0"
edition = "2021"
authors = ["Masaar <support@masaar.sa>"]
description = "ZATCA-compliant e-invoicing API client for Rust"
license = "MIT"
repository = "https://github.com/masaar/masaar-rust"
keywords = ["zatca", "einvoicing", "saudi", "ksa", "vat"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
