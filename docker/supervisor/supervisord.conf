# Masaar Supervisor Configuration
# Manages PHP-FPM, Nginx, and Laravel Queue Workers

[supervisord]
nodaemon=true
user=root
# To the container's own output, where docker logs reads it. This named
# /var/log/supervisor/supervisord.log, a directory Alpine's supervisor
# package does not create, and supervisord refused to start - so the image
# had never run. No rotation: stdout cannot be rotated.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# =============================================================================
# PHP-FPM Process
# =============================================================================
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# =============================================================================
# Nginx Process
# =============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# =============================================================================
# Laravel Queue Worker - Default Queue
# =============================================================================
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=masaar
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-default.log
stopwaitsecs=3600
priority=20

# =============================================================================
# Laravel Queue Worker - ZATCA Submissions (High Priority)
# =============================================================================
[program:laravel-worker-zatca]
process_name=%(program_name)s_%(process_num)02d
# The queue ProcessFatooraSubmission dispatches to, from ZATCA_QUEUE_NAME.
# Written out as zatca-submissions, renaming the queue in .env sent every
# filing to a queue no worker read. The entrypoint supplies the default.
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=%(ENV_ZATCA_QUEUE_NAME)s --sleep=1 --tries=5 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=masaar
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-zatca.log
stopwaitsecs=3600
priority=15

# =============================================================================
# Laravel Queue Worker - Webhooks
# =============================================================================
[program:laravel-worker-webhooks]
process_name=%(program_name)s_%(process_num)02d
# From ZATCA_QUEUE_WEBHOOKS, for the same reason.
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=%(ENV_ZATCA_QUEUE_WEBHOOKS)s --sleep=3 --tries=10 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=masaar
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-webhooks.log
stopwaitsecs=3600
priority=25

# =============================================================================
# Laravel Queue Worker - Peppol (UAE)
# =============================================================================
[program:laravel-worker-peppol]
process_name=%(program_name)s_%(process_num)02d
# The queue SendPeppolDocument dispatches to, from PEPPOL_QUEUE. Its own, so a
# slow UAE service provider never sits in front of a ZATCA clearance. Idle
# where the UAE is off. --tries is the job's own: it counts its attempts.
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=%(ENV_PEPPOL_QUEUE)s --sleep=3 --tries=5 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=masaar
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-peppol.log
stopwaitsecs=3600
priority=25

# =============================================================================
# Laravel Scheduler (runs every minute)
# =============================================================================
[program:laravel-scheduler]
command=/bin/sh -c "while [ true ]; do /usr/local/bin/php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=masaar
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
priority=30
