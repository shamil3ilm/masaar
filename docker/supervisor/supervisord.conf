# CompliPay Supervisor Configuration
# Manages PHP-FPM, Nginx, and Laravel Queue Workers

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# =============================================================================
# PHP-FPM Process
# =============================================================================
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# =============================================================================
# Nginx Process
# =============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# =============================================================================
# Laravel Queue Worker - Default Queue
# =============================================================================
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=complipay
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-default.log
stopwaitsecs=3600
priority=20

# =============================================================================
# Laravel Queue Worker - ZATCA Submissions (High Priority)
# =============================================================================
[program:laravel-worker-zatca]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=zatca-submissions --sleep=1 --tries=5 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=complipay
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-zatca.log
stopwaitsecs=3600
priority=15

# =============================================================================
# Laravel Queue Worker - Webhooks
# =============================================================================
[program:laravel-worker-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/artisan queue:work --queue=webhooks --sleep=3 --tries=10 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=complipay
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-webhooks.log
stopwaitsecs=3600
priority=25

# =============================================================================
# Laravel Scheduler (runs every minute)
# =============================================================================
[program:laravel-scheduler]
command=/bin/sh -c "while [ true ]; do /usr/local/bin/php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=complipay
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
priority=30
