# Virtual host configuration

upstream php-fpm {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Security headers.
    #
    # Repeated in every location below that sets a header of its own, because
    # add_header replaces the inherited set rather than adding to it. See
    # tests/Feature/Architecture/NginxPostureTest.php, which fails if one is
    # added here and not there.
    #
    # DENY rather than SAMEORIGIN: nothing here is framed, including by
    # itself, and this agrees with the SecurityHeaders middleware. While nginx
    # said SAMEORIGIN its `always` won, so the middleware's DENY never took
    # effect in a deployment and only the dev server was as strict as the code
    # claimed.
    #
    # X-XSS-Protection is deliberately absent. Chrome removed the XSS Auditor
    # the header controlled, and in its filtering mode it could be used to
    # suppress chosen scripts on a page. There is nothing left for it to do
    # that the Content-Security-Policy does not do properly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # The content policy, matching SecurityHeaders. No 'unsafe-' of any kind:
    # nothing is fetched from another origin, no view carries an inline script
    # or style, and Alpine is its CSP build, which evaluates no attribute
    # expressions. The middleware adds the Vite dev server to it while that is
    # running; nothing here ever needs to, because this file only serves a
    # built image.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Hide PHP version
    fastcgi_hide_header X-Powered-By;

    # Request size limits
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Refusals come first.
    #
    # nginx tries regex locations in the order they are written and uses the
    # first that matches - there is no longest-match rule as there is for
    # prefix locations. These three sat at the bottom of the file, below both
    # `\.php$` and the static-extension block, so neither ever ran: a request
    # for /storage/x.php matched `\.php$` and was handed to php-fpm, and
    # /storage/x.svg was served by the static block. public/storage does not
    # exist until somebody runs storage:link, so nothing was reachable - but
    # the two rules written to prevent precisely that were not doing it, and
    # would have stayed silent on the day the symlink appeared.
    location ~ ^/(storage|vendor)/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|webpack\.mix\.js) {
        deny all;
    }

    # Healthcheck endpoint (no rate limiting)
    location = /api/health {
        try_files $uri $uri/ /index.php?$query_string;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        access_log off;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 100;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Versioned API routes
    location ~ ^/v[0-9]+/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conn 100;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Static files caching.
    #
    # Every security header from the server block is repeated here. Setting
    # Cache-Control alone discarded all of them, so each stylesheet, script,
    # font and image was served without them - which is what the nightly scan
    # reports as X-Content-Type-Options missing on /build/assets.
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        access_log off;
    }

    # Error pages
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
