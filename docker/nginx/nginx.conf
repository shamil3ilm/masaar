# Masaar Nginx Configuration
# Production-optimized for ZATCA E-Invoicing API

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    server_tokens off;

    # Who a request is from, for the limits below. Behind the reverse proxy
    # every request arrives from the proxy's address, so keyed on that the
    # limits were one bucket shared by every client. From a private network -
    # where the proxy is - the client is the last X-Forwarded-For entry, the
    # one the proxy itself added; from anywhere else the header is the
    # client's own say-so and the connection's address is used.
    #
    # $remote_addr itself is left alone: the application reads the proxy's
    # forwarded headers through TRUSTED_PROXIES, including the scheme, and
    # rewriting the address would make it stop trusting them.
    geo $from_proxy {
        default         0;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        fc00::/7        1;
    }

    map "$from_proxy:$http_x_forwarded_for" $client_key {
        "~^1:(?:.*,)?\s*(?<forwarded_for>[^,\s]+)\s*$" $forwarded_for;
        default                                       $binary_remote_addr;
    }

    # Rate limiting zones
    limit_req_zone $client_key zone=api:10m rate=100r/s;
    limit_conn_zone $client_key zone=conn:10m;

    # Include server configurations
    include /etc/nginx/http.d/*.conf;
}
